# Catálogo de singles: descarga diaria del proveedor (TCGCSV) al catálogo
# central y copia a cada tienda de sus juegos activos.
# - Corre solo cada día a las 05:00 de CDMX (11:00 UTC; GitHub usa UTC y CDMX es
#   UTC-6 todo el año). TCGCSV se actualiza cerca de las 20:00 UTC del día anterior.
# - A mano: Actions → "Sincronizar singles" → Run workflow (por juego y/o tienda).
# - La carga inicial al activar un juego en una tienda lo dispara con
#   juego + ref (Edge Function activar-juego).
# Secrets: SUPABASE_ACCESS_TOKEN y CATALOGO_REF (ID del proyecto kananpos-catalogo).
# Opcional: TCGAPI_KEY (solo si CATALOG_PROVIDER=tcgapi).
name: Sincronizar singles

on:
  schedule:
    - cron: '0 11 * * *' # 05:00 en CDMX
  workflow_dispatch:
    inputs:
      juego:
        description: 'Slugs separados por coma (vacío = los activos en alguna tienda). Ver scripts/singles/juegos.json'
        required: false
        default: ''
      ref:
        description: 'ID del proyecto de una sola tienda (vacío = todas)'
        required: false
        default: ''
      forzar:
        description: 'Bajar todo aunque el proveedor no haya cambiado'
        type: boolean
        default: false
      solo_copiar:
        description: 'No descargar: solo copiar del catálogo central a las tiendas'
        type: boolean
        default: false

permissions:
  contents: read

# Una corrida a la vez (la nocturna y una carga inicial no se pisan).
concurrency:
  group: sincronizar-singles
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Sincronizar
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CATALOGO_REF: ${{ secrets.CATALOGO_REF }}
          CATALOG_PROVIDER: ${{ vars.CATALOG_PROVIDER || 'tcgcsv' }}
          TCGAPI_KEY: ${{ secrets.TCGAPI_KEY }}
          JUEGO: ${{ github.event.inputs.juego }}
          REF: ${{ github.event.inputs.ref }}
          FORZAR: ${{ github.event.inputs.forzar }}
          SOLO_COPIAR: ${{ github.event.inputs.solo_copiar }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$CATALOGO_REF" ]; then
            echo "::warning::Faltan los secrets SUPABASE_ACCESS_TOKEN y CATALOGO_REF; no se sincronizó nada."
            exit 0
          fi
          args=()
          [ -n "$JUEGO" ] && args+=(--juego "$JUEGO")
          [ -n "$REF" ] && args+=(--ref "$REF")
          [ "$FORZAR" = "true" ] && args+=(--forzar)
          [ "$SOLO_COPIAR" = "true" ] && args+=(--solo-copiar)
          node --experimental-strip-types --no-warnings=ExperimentalWarning scripts/singles/cli.ts sync "${args[@]}"
