[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Sitio comercial (public/sitio/index.html) en el dominio principal. La raíz
# necesita force porque index.html existe; el resto de rutas sin force, para que
# sigan saliendo los archivos reales (favicon, íconos). Los subdominios de los
# clientes no entran aquí y siguen con la app.
[[redirects]]
  from = "https://kananpos.com/"
  to = "/sitio/index.html"
  status = 200
  force = true

[[redirects]]
  from = "https://www.kananpos.com/"
  to = "/sitio/index.html"
  status = 200
  force = true

[[redirects]]
  from = "https://kananpos.com/*"
  to = "/sitio/index.html"
  status = 200

[[redirects]]
  from = "https://www.kananpos.com/*"
  to = "/sitio/index.html"
  status = 200

# SPA: todas las rutas sirven index.html (React Router se encarga)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Encabezados de seguridad: la app no se puede incrustar en otro sitio
# (evita clickjacking), el navegador no adivina tipos de archivo y no se
# filtra la URL a otros sitios. La cámara solo para este mismo sitio
# (foto de productos).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
